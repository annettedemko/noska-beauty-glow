name: Build and Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve system Chrome for Puppeteer
        id: chrome
        run: |
          CHROME="$(which google-chrome || which google-chrome-stable || which chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No system Chrome found, installing Puppeteer's Chrome"
            rm -rf ~/.cache/puppeteer
            npx puppeteer browsers install chrome
          else
            echo "Using system Chrome at: $CHROME"
            "$CHROME" --version || true
            echo "path=$CHROME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build project with pre-rendering
        run: npm run build
        env:
          NODE_ENV: production
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.path }}

      - name: Create Vercel build output structure
        run: |
          mkdir -p .vercel/output
          cp -r dist .vercel/output/static
          echo '{"version": 3}' > .vercel/output/config.json

      - name: Deploy to Vercel
        run: |
          npm install -g vercel
          vercel deploy --prebuilt --token ${{ secrets.VERCEL_TOKEN }} --prod
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
